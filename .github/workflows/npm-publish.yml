# Publishes @openllmsh/sdk to npm when a GitHub Release is published here.
#
# This file is authored in the monorepo (openllmsh/openllm, packages/sdk/.github)
# and reaches this repo through the release subtree split — edit it there, never
# here. The monorepo's release pipeline pushes the tagged source, then cuts the
# Release with the openllm-release App token; App-created releases fire this
# workflow (GITHUB_TOKEN-created ones would not).
#
# Stable  vX.Y.Z         → npm dist-tag `latest`
# Prerel  vX.Y.Z-label.N → npm dist-tag `next`
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json version
        id: meta
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          name="$(node -p 'require("./package.json").name')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi
          case "${version}" in
            *-*) dist_tag=next ;;
            *)   dist_tag=latest ;;
          esac
          if [ "${PRERELEASE}" = "true" ] && [ "${dist_tag}" = "latest" ]; then
            echo "::error::release is marked prerelease but ${version} has no prerelease label"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${dist_tag}" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already on npm
        id: exists
        env:
          SPEC: ${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }}
        run: |
          if npm view "${SPEC}" version >/dev/null 2>&1; then
            echo "${SPEC} is already published; nothing to do"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # The source is TypeScript; npm gets compiled JS + .d.ts so plain Node
      # works (Node refuses to strip types inside node_modules). The git tag and
      # `github:` installs keep the source.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.exists.outputs.published != 'true'
        with:
          bun-version: 1.4.4
          no-cache: true

      - name: Build for npm
        if: steps.exists.outputs.published != 'true'
        run: |
          set -euo pipefail
          npm install --no-package-lock --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund \
            typescript@7.0.2 @types/node@24.19.2
          bun scripts/build-npm.ts --tsc ./node_modules/.bin/tsc

      # Install the packed tarball into an empty ESM project and import every
      # subpath on plain Node. A broken build stops here, before npm.
      - name: Smoke-test the package on Node
        if: steps.exists.outputs.published != 'true'
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          node scripts/smoke-npm.ts "$RUNNER_TEMP/${tarball}"

      # Trusted publishing (OIDC): npm trusts this repo + this workflow file, so
      # there is no token. Provenance is attached automatically.
      - name: Publish
        if: steps.exists.outputs.published != 'true'
        env:
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "${npm_version}" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm ${npm_version} is too old for trusted publishing (needs >= 11.5.1)"
            exit 1
          fi
          npm publish --access public --tag "${DIST_TAG}"
